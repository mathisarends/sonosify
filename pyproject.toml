[project]
name = "sonosify"
version = "0.1.0"
description = "Programmatic Python API for discovering and controlling Sonos speakers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
